services:
  db:
    image: postgres:18-alpine
    container_name: diamond-db
    environment:
      POSTGRES_USER: diamond
      POSTGRES_PASSWORD: diamond
      POSTGRES_DB: diamond
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamond -d diamond"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - diamond-pg-data:/var/lib/postgresql

  db-init:
    image: migrate/migrate:v4.18.3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://diamond:diamond@db:5432/diamond?sslmode=disable",
        "up",
      ]
    restart: "no"

  mlb-mock:
    build:
      context: ./apps/mlb-mock
    container_name: diamond-mlb-mock
    command:
      [
        "python",
        "app/main.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
        "--replay-speed",
        "300",
      ]
    ports:
      - "8090:8090"

  api:
    image: nginx:alpine
    container_name: diamond-api-placeholder
    ports:
      - "18000:80"

  ingest:
    image: alpine:3.20
    container_name: diamond-ingest-placeholder
    command: ["sh", "-c", "while true; do sleep 3600; done"]

  web:
    image: nginx:alpine
    container_name: diamond-web-placeholder
    ports:
      - "5173:80"

volumes:
  diamond-pg-data:
