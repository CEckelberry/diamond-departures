services:
  db:
    image: postgres:18-alpine
    container_name: diamond-db
    environment:
      POSTGRES_USER: diamond
      POSTGRES_PASSWORD: diamond
      POSTGRES_DB: diamond
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamond -d diamond"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - diamond-pg-data:/var/lib/postgresql/data

  db-init:
    image: migrate/migrate:v4.18.3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://diamond:diamond@db:5432/diamond?sslmode=disable",
        "up",
      ]
    restart: "no"

  mlb-mock:
    build:
      context: ./apps/mlb-mock
    container_name: diamond-mlb-mock
    command:
      [
        "python",
        "app/main.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
        "--replay-speed",
        "300",
      ]
    ports:
      - "8090:8090"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: diamond-api
    environment:
      - DATABASE_URL=postgresql://diamond:diamond@db:5432/diamond
    ports:
      - "18000:18000"
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
    container_name: diamond-ingest
    environment:
      - DATABASE_URL=postgresql://diamond:diamond@db:5432/diamond
      - MLB_API_URL=http://mlb-mock:8090
    depends_on:
      db:
        condition: service_healthy
      mlb-mock:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: diamond-web
    environment:
      - API_URL=http://api:18000
      - PORT=5173
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  diamond-pg-data:
